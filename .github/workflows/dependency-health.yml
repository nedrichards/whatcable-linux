name: Dependency health
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/dependency-health.yml'
      - 'scripts/ci/dependency-health.py'
permissions:
  contents: read
concurrency:
  group: dependency-health-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flatpak:
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Configure container remote
        run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Check runtime support and inventory bundled dependencies
        run: |
          set -o pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            python3 scripts/ci/dependency-health.py build-aux/com.nedrichards.WhatCable.Devel.json build-aux/stable/com.nedrichards.WhatCable.json --prepare-only 2>&1 | tee dependency-health.log
          else
            python3 scripts/ci/dependency-health.py build-aux/com.nedrichards.WhatCable.Devel.json build-aux/stable/com.nedrichards.WhatCable.json 2>&1 | tee dependency-health.log
          fi
      - name: Preserve dependency report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: dependency-health-${{ matrix.arch }}
          path: dependency-health.log
          retention-days: 14
          if-no-files-found: warn
      - name: Summarize dependency checks
        if: always()
        run: |
          if [ -f dependency-health.log ]; then
            { echo '### Dependency health'; echo '```text'; cat dependency-health.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    name: Runtime health (${{ matrix.arch }})
    container:
      image:
        ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
    defaults:
      run:
        shell: bash
  sources:
    name: Bundled source metadata
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare architecture-independent source inventory
        run: python3 scripts/ci/dependency-health.py build-aux/com.nedrichards.WhatCable.Devel.json
          build-aux/stable/com.nedrichards.WhatCable.json --prepare-only
      - name: Check published dependency versions
        uses:
          docker://ghcr.io/flathub/flatpak-external-data-checker@sha256:1ebea5d5f44e5fe58ae6db0ce36808b263252092e1947e4e964aa00f03996c6a
        with:
          args: --check-outdated /github/workspace/dependency-sources.json
      - name: Preserve checked source inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bundled-source-inventory
          path: dependency-sources.json
          if-no-files-found: warn
          retention-days: 14
