name: Maintenance checks
on:
  push:
    branches: [main]
    paths:
      - 'scripts/ci/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'scripts/ci/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard-tests:
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
