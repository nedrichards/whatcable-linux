name: Flatpak Build

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: "Build Flatpak"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.7
        with:
          bundle: WhatCable-Devel-${{ github.sha }}-x86_64.flatpak
          manifest-path: build-aux/com.nedrichards.WhatCable.Devel.json
          cache-key: flatpak-builder-${{ github.sha }}
          run-tests: true
          keep-build-dirs: true
          upload-artifact: false

      - name: Upload development bundle
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: WhatCable-Devel-${{ github.sha }}-x86_64
          path: WhatCable-Devel-${{ github.sha }}-x86_64.flatpak
          if-no-files-found: error
          retention-days: 14
      - name: Summarize development bundle
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo '### Development Flatpak'
            echo "Download: ${ARTIFACT_URL}"
            echo "Built checkout: ${GITHUB_SHA}"
            echo "PR head: ${PR_HEAD}"
            echo 'Retention: 14 days'
            echo 'Install after extracting the artifact:'
            echo '```console'
            echo "flatpak install --user ./WhatCable-Devel-${GITHUB_SHA}-x86_64.flatpak"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve Flatpak test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-test-logs-${{ github.sha }}
          path: .flatpak-builder/build/**/meson-logs/testlog.*
          if-no-files-found: warn
          retention-days: 14
